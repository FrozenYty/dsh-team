name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-record guard compares this branch with origin/main, and the default checkout fetches
          # one commit of the pull request ref only — so without this line the guard would report that it
          # could not run, on every pull request, forever.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Node 24: Node 22 documents this flag as `--experimental-test-isolation`, and the local runner
          # is Node 24. Pinning the same major keeps "passes locally" and "green in CI" the same statement.
          node-version: "24"

      - name: Bundle modules parse as ESM
        run: |
          node --check index.js
          node --check actions.js
          node --check roster.js
          node --check definitions.js
          node --check trash.js
          node --check host-hooks.js

      - name: Unit tests
        # One process: the tests are pure or use temporary directories, and process isolation is the only
        # thing the default runner adds. It also matches how they are run on Windows.
        run: node --test --test-isolation=none tests/*.test.mjs

      - name: Repository checks
        run: node scripts/check.mjs
