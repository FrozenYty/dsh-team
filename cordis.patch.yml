# dsh-team bundle patch.
#
# 1. Enable the shipped compaction backend. The row is present in the composed profile but inactive, so
#    nothing condenses: an agent grows unchecked toward the window. A shipped package, so this bundle
#    declares no dependency on it; the row resolves from the dsh installation.
#
#    Deliberately NOT enabled: `command-compact` (`/compact`). It needs the `commands` service, which
#    this profile also leaves unmounted, so enabling the row alone leaves it `absent`.
#
# 2. Insert this bundle's own Host plugin. It owns the roster, the host-side projection filter and the
#    roster slot credit; the shipped team *service* row (`agent-team`) stays mounted because adoption and
#    the projection filter read it, while the shipped team *tool* row is disabled by entry 3 below.
#
#    The row id is FROZEN at `team-roster` and must never be renamed with the package. It is the override
#    target a profile writes: that profile's own cordis.patch.yml replaces this `config` wholesale with
#    `- id: team-roster` + `config: { trashLimit: <integer> }` to change the per-Lead session-trash cap
#    (ADR 0012). An out-of-range value is refused when the profile loads. Renaming the id would silently
#    stop every existing profile's override from matching, so the cap would revert to the default with no
#    error; the package was renamed to `dsh-team` and the id deliberately stayed (ADR 0014).
- id: compaction-basic
  disabled: false

- insert:
    - id: team-roster
      name: 'dsh-team'
      config: {}

# 3. Retire the shipped team tool row (P2-07). The row publishes `spawn_teammate`, `send_message`,
#    `list_agents`, `interrupt_agent`, `wait_agent` and the shipped `team_task_*` tools, all model-facing;
#    this plugin serves the same Lead with `spawn_member`, `message_member`, `list_members`,
#    `stop_member` and `task_board`. Every one of those has an equivalent here EXCEPT `wait_agent`: this
#    plugin has no blocking wait, so a model that used to wait instead re-reads `list_members` to see who
#    is live and calls `message_member` to wake a member it needs, and reads `inactive` as "no turn is
#    executing", never as "finished". The cost is the row's two other products: it also owns the shipped
#    shared task board, whose existing rows this plugin neither reads nor migrates (ADR 0017) — a Lead
#    that wrote tasks there loses sight of them when this row goes off unless it re-creates them on
#    `task_board` — and it publishes the shipped team-policy and Lead-identity system-prompt sections,
#    which go with it (which is also what keeps the prompt from naming tools the Lead no longer has).
#
#    The `agent-team` service row is deliberately NOT touched: adoption (`list_members` reporting the
#    members the shipped roster created) and the projection filter read that service, and disabling it
#    would take both away as well as this plugin's own membership test. That service is itself
#    model-facing: it publishes `list_agents`, `send_message` and `interrupt_agent`, so those three stay in
#    a Lead's tool list after this entry applies. Read the result as "the shipped spawn, wait and task
#    tools are gone", not as "one tool set is left".
- id: tool-agent-team
  disabled: true
